name: Build Nong Nghiep Xanh APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Lay ma nguon
        uses: actions/checkout@v4

      - name: Cai Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cai Android platform
        shell: bash
        run: |
          set -e
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          SDKMANAGER="$(find "$SDK/cmdline-tools" -type f -name sdkmanager 2>/dev/null | head -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "::error::Khong tim thay sdkmanager trong $SDK"
            exit 1
          fi
          "$SDKMANAGER" --licenses </dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Bien dich APK
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: '8.9'
          arguments: --no-daemon clean assembleDebug

      - name: Kiem tra va dong goi APK
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          mkdir -p dist
          cp "$APK" dist/NongNghiepXanh-debug.apk
          ls -lh dist/NongNghiepXanh-debug.apk
          echo "Build APK thanh cong." >> "$GITHUB_STEP_SUMMARY"

      - name: Luu file APK
        uses: actions/upload-artifact@v4
        with:
          name: NongNghiepXanh-debug-${{ github.run_number }}
          path: dist/NongNghiepXanh-debug.apk
          if-no-files-found: error
          retention-days: 7
