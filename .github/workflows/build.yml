name: Build Nong Nghiep Xanh APK

on:
workflow_dispatch:
push:
branches:
- main

jobs:
build:
runs-on: ubuntu-latest

steps:
  - name: Lay ma nguon
    uses: actions/checkout@v4

  - name: Cai Java
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '17'

  - name: Cai Android SDK
    run: |
      SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
      echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
      echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

      SDKMANAGER="$SDK/cmdline-tools/16.0/bin/sdkmanager"

      if [ ! -f "$SDKMANAGER" ]; then
        SDKMANAGER="$(find "$SDK/cmdline-tools" -name sdkmanager -type f | head -n 1)"
      fi

      if [ ! -f "$SDKMANAGER" ]; then
        echo "Khong tim thay sdkmanager"
        exit 1
      fi

      yes | "$SDKMANAGER" --licenses

      "$SDKMANAGER" \
        "platform-tools" \
        "platforms;android-35" \
        "build-tools;35.0.0"

  - name: Bien dich APK
    uses: gradle/gradle-build-action@v3
    with:
      gradle-version: '8.9'
      arguments: assembleDebug

  - name: Luu file APK
    uses: actions/upload-artifact@v4
    with:
      name: NongNghiepXanh-APK
      path: app/build/outputs/apk/debug/app-debug.apk                
