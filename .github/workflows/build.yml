name: Build Nong Nghiep Xanh APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Lay ma nguon
        uses: actions/checkout@v4

      - name: Cai Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cai Android SDK
        uses: android-actions/setup-android@v3

      - name: Cai Android platform
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Bien dich APK
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: '8.9'
          arguments: --no-daemon clean assembleDebug

      - name: Kiem tra va dong goi APK
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          mkdir -p dist
          cp "$APK" dist/NongNghiepXanh-debug.apk
          ls -lh dist/NongNghiepXanh-debug.apk
          echo "Build APK thanh cong." >> "$GITHUB_STEP_SUMMARY"

      - name: Luu file APK
        uses: actions/upload-artifact@v4
        with:
          name: NongNghiepXanh-debug-${{ github.run_number }}
          path: dist/NongNghiepXanh-debug.apk
          if-no-files-found: error
          retention-days: 7
