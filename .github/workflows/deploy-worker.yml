name: Deploy Nong Nghiep Xanh AI Worker

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "worker.js"
      - "wrangler.toml"
      - ".github/workflows/deploy-worker.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Wrangler
        run: npm install --global wrangler

      - name: Check secret formatting
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node -e '
            for (const [name, value] of Object.entries({
              CLOUDFLARE_API_TOKEN: process.env.CF_TOKEN,
              CLOUDFLARE_ACCOUNT_ID: process.env.CF_ACCOUNT
            })) {
              if (!value) {
                console.error(name + " is missing");
                process.exitCode = 1;
              } else if (/[\r\n]/.test(value)) {
                console.error(name + " contains a newline");
                process.exitCode = 1;
              } else {
                console.log(name + " is present; no newline detected");
              }
            }
          '

      - name: Deploy Worker
        run: wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
