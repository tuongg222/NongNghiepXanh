name: Build Nong Nghiep Xanh APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'flutter_app/**'
      - '.github/workflows/build-flutter-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.35.7'

      - name: Generate Android scaffold
        run: |
          flutter create --platforms=android --project-name nong_nghiep_xanh /tmp/nx_scaffold
          cp -r /tmp/nx_scaffold/android flutter_app/

      - name: Install dependencies
        working-directory: flutter_app
        run: flutter pub get

      - name: Build APK
        working-directory: flutter_app
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NongNghiepXanh-APK
          path: flutter_app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
